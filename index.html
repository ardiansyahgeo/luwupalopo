  <title>WEBPORTAL PENYUSUNAN RDTR WILAYAH PERENCANAAN BUA KABUPATEN LUWU DAN WILAYAH PERENCANAAN TELLUWANUA KOTA PALOPO</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      height:100vh;
      overflow:hidden;
    }

    /* =========================
       BACKGROUND SLIDER
    ========================== */

    .slider{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      z-index:-2;
    }

    .slide{
      position:absolute;
      width:100%;
      height:100%;
      top:0;
      left:0;

      background-size:cover;
      background-position:center center;
      background-repeat:no-repeat;

      opacity:0;
      animation:fade 24s infinite;
    }

    /* =========================
       LOKASI FILE BACKGROUND
       simpan di folder img
       
       FORMAT BOLEH BERBEDA:
       jpg, jpeg, png, webp
    ========================== */

    .slide:nth-child(1){
      background-image:url('./img/background1.jpeg');
      animation-delay:0s;
    }

    .slide:nth-child(2){
      background-image:url('./img/background2.jpg');
      animation-delay:3s;
    }

    .slide:nth-child(3){
      background-image:url('./img/background3.jpg');
      animation-delay:6s;
    }

    .slide:nth-child(4){
      background-image:url('./img/background4.jpg');
      animation-delay:10s;
    }
	
	 .slide:nth-child(5){
      background-image:url('./img/background5.jpg');
      animation-delay:15s;
    }
	
	 .slide:nth-child(6){
      background-image:url('./img/background6.jpg');
      animation-delay:20s;
    }

    /* =========================
       ANIMASI SLIDE
    ========================== */

    @keyframes fade{

      0%{
        opacity:0;
      }

      8%{
        opacity:1;
      }

      25%{
        opacity:1;
      }

      33%{
        opacity:0;
      }

      100%{
        opacity:0;
      }

    }

    /* =========================
       OVERLAY GELAP
    ========================== */

    .overlay{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.45);
      z-index:-1;
    }

    /* =========================
       CONTENT
    ========================== */

    .container{
      width:100%;
      height:100vh;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;

      text-align:center;
      color:white;

      padding:20px;
    }

    /* =========================
       JUDUL
    ========================== */

    h1{
      font-size:36px;
      line-height:1.4;
      text-transform:uppercase;

      margin-bottom:15px;

      text-shadow:
      2px 2px 10px rgba(0,0,0,0.8);

      max-width:900px;
    }

    p{
      font-size:17px;
      margin-bottom:35px;
      letter-spacing:1px;

      text-shadow:
      1px 1px 6px rgba(0,0,0,0.8);
    }

    /* =========================
       MENU
    ========================== */

    .links{
      width:100%;
      max-width:430px;
    }

    .links a{
      display:block;

      margin:15px 0;
      padding:16px;

      text-decoration:none;
      color:white;

      font-size:18px;
      font-weight:bold;

      border-radius:18px;

      background:rgba(255,255,255,0.18);

      border:1px solid rgba(255,255,255,0.35);

      backdrop-filter:blur(8px);

      transition:0.3s;

      box-shadow:
      0 5px 15px rgba(0,0,0,0.3);
    }

    .links a:hover{
      background:white;
      color:black;

      transform:scale(1.03);
    }

    /* =========================
       FOOTER
    ========================== */

    .footer{
      position:absolute;
      bottom:20px;

      font-size:14px;

      opacity:0.85;

      text-shadow:
      1px 1px 5px black;
    }

    /* =========================
       RESPONSIVE
    ========================== */

    @media(max-width:768px){

      h1{
        font-size:24px;
      }

      p{
        font-size:14px;
      }

      .links a{
        font-size:16px;
        padding:14px;
      }

    }

  </style>

</head>
