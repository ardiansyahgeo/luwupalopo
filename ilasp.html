<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>WebGIS ATR/BPN</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

html,body{

width:100%;
height:100%;
overflow:hidden;
background:#4aa66a;

}

/*=========================
BACKGROUND
=========================*/

.bg{

position:fixed;
left:0;
top:0;

width:100%;
height:100%;

background:url("images/background.png") no-repeat center center;

background-size:contain;

background-color:#4aa66a;

z-index:-2;

}

.overlay{

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

background:linear-gradient(
90deg,
rgba(30,155,190,.18),
rgba(60,170,90,.12)
);

z-index:-1;

}

/*=========================
LAYOUT
=========================*/

.container{

height:100%;

display:flex;

align-items:center;
justify-content:space-between;

padding:50px 70px;

}

/*=========================
LEFT
=========================*/

.left{

width:48%;
color:white;

}

.logo{

display:flex;
align-items:center;
gap:25px;

margin-bottom:40px;

}

.logo img{

height:45px;

}

.title{

font-size:62px;

font-weight:800;

line-height:1.05;

margin-bottom:30px;

text-shadow:0 5px 15px rgba(0,0,0,.2);

}

.subtitle{

display:inline-flex;

align-items:center;

background:#0079c8;

padding:14px 30px;

border-radius:40px;

font-size:28px;

font-weight:700;

margin-bottom:45px;

}

.subtitle span{

margin-left:20px;

font-size:30px;

}

/*=========================
MENU
=========================*/

.menu{

display:flex;

flex-direction:column;

gap:18px;

max-width:500px;

}

.item{

display:flex;

align-items:center;

background:white;

padding:15px;

border-radius:50px;

text-decoration:none;

color:#333;

box-shadow:0 10px 25px rgba(0,0,0,.18);

transition:.3s;

}

.item:hover{

transform:translateX(10px);

}

.icon{

width:58px;
height:58px;

border-radius:50%;

background:#1494d1;

display:flex;

align-items:center;

justify-content:center;

font-size:26px;

color:white;

margin-right:18px;

}

.label{

font-size:15px;

font-weight:500;

color:#555;

}

.value{

font-size:18px;

font-weight:700;

}

/*=========================
RIGHT
=========================*/

.right{

width:45%;

display:flex;

justify-content:center;

align-items:center;

}

.phone{

width:470px;

max-width:100%;

transform:rotate(-10deg);

filter:drop-shadow(0 25px 35px rgba(0,0,0,.35));

transition:.4s;

}

.phone:hover{

transform:rotate(-8deg) scale(1.03);

}

/*=========================
RESPONSIVE
=========================*/

@media(max-width:1100px){

html,body{

overflow:auto;

}

.container{

flex-direction:column;

padding:40px;

}

.left{

width:100%;

}

.right{

width:100%;

margin-top:40px;

}

.phone{

width:330px;

}

.title{

font-size:42px;

}

.subtitle{

font-size:22px;

}

.menu{

max-width:100%;

}

.bg{

background-size:cover;

}

}

</style>

</head>

<body>

<div class="bg"></div>

<div class="overlay"></div>

<div class="container">

<div class="left">

<div class="logo">

<img src="images/atr.png">

<img src="images/ilaspp.png">

<img src="images/worldbank.png">

</div>

<div class="title">

Layanan<br>

Pengaduan & Informasi

</div>

<div class="subtitle">

Kementerian ATR/BPN

<span>➜</span>

</div>

<div class="menu">

<a class="item" href="https://lapor.go.id" target="_blank">

<div class="icon">🌐</div>

<div>

<div class="label">Website</div>

<div class="value">www.lapor.go.id</div>

</div>

</a>

<a class="item" href="mailto:surat@atrbpn.go.id">

<div class="icon">✉</div>

<div>

<div class="label">Email</div>

<div class="value">surat@atrbpn.go.id</div>

</div>

</a>

<a class="item" href="https://wa.me/6281110680000">

<div class="icon">☎</div>

<div>

<div class="label">Whatsapp</div>

<div class="value">0811-1068-0000</div>

</div>

</a>

<a class="item" href="#">

<div class="icon">📱</div>

<div>

<div class="label">Media Sosial ATR/BPN</div>

</div>

</a>

<a class="item" href="#">

<div class="icon">📷</div>

<div>

<div class="label">Media Sosial ILASPP</div>

<div class="value">@ilasppproject</div>

</div>

</a>

</div>

</div>

<div class="right">

<img src="images/phone.png" class="phone">

</div>

</div>

</body>

</html>
